spring.application.name=96-video-streaming-api
server.port=${PORT\:8098}\n
spring.datasource.url=jdbc\:h2\:mem\:videodb
spring.datasource.username=sa\n
spring.cache.type=caffeine\n
spring.cache.caffeine.spec=spring.cache.caffeine.spec\=maximumSize\=1000,expireAfterAccess\=600s
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update\n
spring.jpa.show-sql=true\n
spring.h2.console.enabled=true\n
spring.h2.console.path=/h2-console\n
spring.servlet.multipart.max-file-size=100MB\n
spring.servlet.multipart.max-request-size=100MB
